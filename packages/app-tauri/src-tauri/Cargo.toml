[package]
name = "opendicomviewer-desktop"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "OpenDicomViewer desktop validation shell"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
tauri-plugin-opener = "2"
